services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  # Executa a automacao pesada (ingestao, chamadas a DeepSeek, download de
  # imagens) fora do ciclo de requisicao HTTP - consome a fila Redis.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --backoff=10 --max-time=3600 --sleep=3
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # `schedule:work` roda o loop de agendamento em foreground (equivalente a
  # `* * * * * php artisan schedule:run` via cron, sem precisar de crontab
  # dentro do container).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  # Roda as migrations uma vez e sai; app/worker/scheduler esperam ela
  # terminar com sucesso antes de subir (evita corrida de "tabela nao existe").
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan migrate --force
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
